<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>IMPASSE — 靶场 v0.7</title>
<link rel="stylesheet" href="css/style.css?v=0.7">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body class="home">
<canvas id="game-canvas"></canvas>

<!-- 失血红屏（主循环按失血速率控制透明度） -->
<div id="bleed-vignette"></div>

<!-- 失血过多倒地黑场 -->
<div id="collapse-fade"></div>

<!-- 准星 -->
<div id="crosshair">
  <span class="ch-line ch-top"></span>
  <span class="ch-line ch-right"></span>
  <span class="ch-line ch-bottom"></span>
  <span class="ch-line ch-left"></span>
  <span class="ch-dot"></span>
</div>

<!-- 命中标记 -->
<div id="hitmarker">
  <span class="hm-bar hm-tl"></span>
  <span class="hm-bar hm-tr"></span>
  <span class="hm-bar hm-bl"></span>
  <span class="hm-bar hm-br"></span>
</div>
<div id="hitmarker-label"></div>

<!-- 左下：弹药与状态 -->
<div id="hud-bl">
  <div id="ammo"><span id="ammo-mag">30</span><span id="ammo-res">/ ∞</span></div>
  <div id="gun-state"><span id="fire-mode">连发</span><span id="ads-state">腰射</span></div>
  <div id="bleed-indicator"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2z"/></svg><span id="bleed-zones"></span></div>
  <div id="reload-wrap"><div id="reload-bar"></div><span>换弹中…</span></div>
  <div id="bandage-wrap"><div id="bandage-bar"></div><span>包扎中…</span></div>
</div>

<!-- 右上：计分与重置 -->
<div id="hud-tr">
  <div id="score-line">命中率 0%（0/0）· 用时 00:00</div>
  <div id="zone-line">头 0 · 胸 0 · 腹 0 · 臂 0 · 腿 0</div>
  <button id="btn-reset" type="button">重置靶子</button>
  <button id="btn-pause" type="button">暂停</button>
</div>

<!-- 右侧：毁伤日志 -->
<div id="damage-log"></div>

<!-- 中央提示 -->
<div id="toast"></div>

<!-- 触屏控制层 -->
<div id="touch-ui">
  <div id="joystick-zone"></div>
  <div id="look-zone"></div>
  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <button id="btn-fire" type="button" aria-label="开火"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c2.4 3 3.4 6 3.4 9.2V19a1.6 1.6 0 0 1-1.6 1.6H10.2A1.6 1.6 0 0 1 8.6 19v-8.3c0-3.2 1-6.2 3.4-9.2z"/><rect x="8.6" y="15.5" width="6.8" height="1.6" fill="rgba(0,0,0,0.35)"/></svg></button>
  <button id="btn-aim" type="button" aria-label="瞄准"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><line x1="12" y1="1.5" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="22.5" y2="12"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></button>
  <button id="btn-reload" type="button" aria-label="换弹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
  <button id="btn-mode" type="button" aria-label="射击模式" class="auto"><svg class="icon-auto" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="translate(-7.2,3) scale(0.7)"><path d="M12 1.5c2.4 3 3.4 6 3.4 9.2V19a1.6 1.6 0 0 1-1.6 1.6H10.2A1.6 1.6 0 0 1 8.6 19v-8.3c0-3.2 1-6.2 3.4-9.2z"/></g><g transform="translate(0,3) scale(0.7)"><path d="M12 1.5c2.4 3 3.4 6 3.4 9.2V19a1.6 1.6 0 0 1-1.6 1.6H10.2A1.6 1.6 0 0 1 8.6 19v-8.3c0-3.2 1-6.2 3.4-9.2z"/></g><g transform="translate(7.2,3) scale(0.7)"><path d="M12 1.5c2.4 3 3.4 6 3.4 9.2V19a1.6 1.6 0 0 1-1.6 1.6H10.2A1.6 1.6 0 0 1 8.6 19v-8.3c0-3.2 1-6.2 3.4-9.2z"/></g></svg><svg class="icon-semi" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c2.4 3 3.4 6 3.4 9.2V19a1.6 1.6 0 0 1-1.6 1.6H10.2A1.6 1.6 0 0 1 8.6 19v-8.3c0-3.2 1-6.2 3.4-9.2z"/></svg></button>
  <button id="btn-jump" type="button" aria-label="跳跃"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="5 11 12 4 19 11"/></svg></button>
  <button id="btn-bandage" type="button" aria-label="包扎"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></button>
</div>

<!-- 布局编辑条（仅编辑布局时显示） -->
<div id="layout-edit-bar">
  <span>拖动按钮调整位置</span>
  <button id="btn-layout-reset" type="button">恢复默认布局</button>
  <button id="btn-layout-done" type="button">完成</button>
</div>

<!-- 主页（id 保持 start-overlay：设置面板的 origin 判定、HUD 的 showStart/hideStart、 -->
<!-- 版本标签写入都按这个 id 找；主页取代旧的开始界面，不再有第二个开始屏） -->
<div id="start-overlay" class="overlay show">
  <div class="home">
    <div class="home-main">
      <h1 class="home-title">IMPASSE <span class="ver">v0.7</span></h1>
      <p class="home-sub">靶场模式 · 无血条 · 模块化毁伤判定</p>
      <div class="mode-list">
        <div class="mode-card selected">
          <div class="mode-info">
            <span class="mode-name">靶场</span>
            <span class="mode-desc">单人练习 · 纸靶 / 钢板 / 分区假人 · 失血系统</span>
          </div>
        </div>
        <div class="mode-card disabled" aria-disabled="true">
          <div class="mode-info">
            <span class="mode-name">团队死斗 5v5</span>
            <span class="mode-desc">重生制团队对抗 · 敌人 AI · 完整地图</span>
          </div>
          <span class="mode-tag">开发中</span>
        </div>
      </div>
      <div class="home-actions">
        <button id="btn-start" type="button" class="home-btn-primary">进入靶场</button>
        <div class="home-actions-row">
          <button id="btn-settings-start" type="button" class="home-btn-ghost"><svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
          <button id="btn-help" type="button" class="home-btn-ghost">操作说明</button>
        </div>
      </div>
      <p class="home-foot"><span class="ver">v0.7</span> · Three.js · 纯静态页面</p>
    </div>
    <div class="home-records">
      <h2>射击记录</h2>
      <div id="records-body"><p class="records-empty">暂无记录，去靶场打一局</p></div>
    </div>
  </div>
</div>

<!-- 操作说明（内容由主循环按当前键位生成，关闭返回主页） -->
<div id="help-overlay" class="overlay">
  <div class="panel help-panel">
    <h2>操作说明</h2>
    <div id="help-body"></div>
    <div class="settings-actions">
      <button id="btn-help-close" type="button">返回</button>
    </div>
  </div>
</div>

<!-- 暂停界面（桌面端指针锁定丢失时，或触屏点右上角“暂停”时） -->
<div id="pause-overlay" class="overlay">
  <div class="panel">
    <h1>已暂停</h1>
    <p class="sub" id="pause-sub">指针锁定已解除</p>
    <button id="btn-resume" type="button">点击继续</button>
    <button id="btn-home" type="button" class="btn-ghost">返回主页</button>
    <button id="btn-settings-pause" type="button" class="btn-ghost"><svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
  </div>
</div>

<!-- 设置界面（内容由 js/settings.js 生成） -->
<div id="settings-overlay" class="overlay">
  <div class="panel settings-panel" id="settings-panel"></div>
</div>

<script type="module" src="js/main.js?v=0.7"></script>
</body>
</html>
